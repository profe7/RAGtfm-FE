server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 150M;

    location /auth/        { proxy_pass http://ragtfm-api:8000; }
    location /documents/   { proxy_pass http://ragtfm-api:8000; }
    location /documents    { proxy_pass http://ragtfm-api:8000; }
    location /health/      { proxy_pass http://ragtfm-api:8000; }
    location /health       { proxy_pass http://ragtfm-api:8000; }
    location /ingest/      { proxy_pass http://ragtfm-api:8000; }

    location /rag/ {
        proxy_pass http://ragtfm-api:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /retrieve/    { proxy_pass http://ragtfm-api:8000; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}