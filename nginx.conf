server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 150M;   # <-- add this line

    location /auth/        { proxy_pass http://ragtfm-api:8000; }
    location /documents/   { proxy_pass http://ragtfm-api:8000; }
    location /documents    { proxy_pass http://ragtfm-api:8000; }
    location /ingest/      { proxy_pass http://ragtfm-api:8000; }
    location /rag/         { proxy_pass http://ragtfm-api:8000; }
    location /retrieve/    { proxy_pass http://ragtfm-api:8000; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}