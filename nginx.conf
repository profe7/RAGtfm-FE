log_format sanitized '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log sanitized;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 11M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    resolver 127.0.0.11 valid=10s;
    set $api_backend "http://ragtfm-api:8000";

    location /api/v1/ {
        proxy_pass $api_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /api/v1/documents/events {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        proxy_pass $api_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
