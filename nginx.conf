server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 150M;

    # Use Docker internal DNS resolver to dynamically resolve the backend
    resolver 127.0.0.11 valid=10s;
    set $api_backend "http://ragtfm-api:8000";

    location /auth/        { proxy_pass $api_backend; }
    location /documents/   { proxy_pass $api_backend; }
    location /documents    { proxy_pass $api_backend; }
    location /health/      { proxy_pass $api_backend; }
    location /health       { proxy_pass $api_backend; }
    location /ingest/      { proxy_pass $api_backend; }

    location /rag/ {
        proxy_pass $api_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /retrieve/    { proxy_pass $api_backend; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}